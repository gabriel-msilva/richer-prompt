name: Test, Build and Release

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  pull_request:
    branches: [main]

env:
  UV_VERSION: 0.11.19

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          version: "${{ env.UV_VERSION }}"
          python-version: "3.11"

      - name: Run pre-commit hooks
        run: uvx pre-commit@4.6.0 run --show-diff-on-failure --color=always --all-files

  tests:
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          version: "${{ env.UV_VERSION }}"
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked pytest --color yes

  tests-lowest-direct:
    needs: [pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Run tests
        run: uv run --resolution lowest-direct pytest --color yes

  docs:
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Build Sphinx docs
        run: |
          uv run --locked --group docs \
            sphinx-build docs/ docs/_build/ \
              --builder html \
              --fail-on-warning \
              --color \
              --verbose

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags')
    needs:
      - tests
      - tests-lowest-direct
      - docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Build Python package
        run: uv build --no-sources

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: dist/

  release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    environment:
      name: pypi
      url: https://pypi.org/p/richer-prompt
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v7
        with:
          name: package-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
